<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje Streaki • Dead by Daylight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style_streaki.css">
  <script src="script_streaki.js" defer></script>
</head>

<body>
  <div class="bg-layer"></div>
  <div class="fog"></div>

  <header>
    <div class="logo-mark">STREAKS</div>
    <div class="subtitle">Dead by Daylight</div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="total-characters">0</div>
        <div class="stat-label">Postaci</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-streaks">0</div>
        <div class="stat-label">Streaków</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="best-streak">0</div>
        <div class="stat-label">Najlepszy</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="active-count">0</div>
        <div class="stat-label">Active</div>
      </div>
    </div>
  </header>

  <main>
    <div class="section-title">Aktualne streaki</div>
    <div class="grid" id="streak-grid"></div>

  </main>



</body>

</html>
