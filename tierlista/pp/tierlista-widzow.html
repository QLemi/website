<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tierlista Widzów</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      line-height: 1.4;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
    }

    .subtitle {
      text-align: center;
      color: #a0a0b0;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .tiers-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto 36px;
    }

    .tier {
      display: flex;
      min-height: 90px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: box-shadow 0.2s;
    }

    .tier:hover {
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.55);
    }

    .tier-header {
      width: 170px;
      min-width: 170px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 8px;
      color: #111;
      flex-shrink: 0;
      gap: 3px;
    }

    .tier-header .tier-main {
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    .tier-header .tier-sub {
      font-weight: 500;
      font-size: 0.68rem;
      line-height: 1.25;
      opacity: 0.85;
      max-width: 100%;
    }

    .tier-content {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content: flex-start;
      min-height: 90px;
      transition: background 0.2s, min-height 0.2s;
    }

    .tier-content.drag-over {
      background: rgba(255, 255, 255, 0.12);
      outline: 2px dashed #48dbfb;
      outline-offset: -4px;
    }

    .tier:nth-child(1) .tier-header {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
    }

    .tier:nth-child(2) .tier-header {
      background: linear-gradient(135deg, #feca57, #ff9f43);
    }

    .tier:nth-child(3) .tier-header {
      background: linear-gradient(135deg, #48dbfb, #0abde3);
    }

    .tier:nth-child(4) .tier-header {
      background: linear-gradient(135deg, #ac76e1, #ac76e1);
    }

    .tier:nth-child(5) .tier-header {
      background: linear-gradient(135deg, #1dd1a1, #10ac84);
    }

    .tier:nth-child(6) .tier-header {
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
    }

    .tier:nth-child(7) .tier-header {
      background: linear-gradient(135deg, #fd79a8, #e84393);
    }

    .pool-section {
      max-width: 1100px;
      margin: 0 auto;
    }

    .pool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pool-title {
      font-size: 1.15rem;
      color: #c0c0d0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pool-title::before {
      content: "📦";
    }

    .reset-btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 12px rgba(238, 90, 90, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }

    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 16px rgba(238, 90, 90, 0.5);
      filter: brightness(1.08);
    }

    .reset-btn:active {
      transform: translateY(0);
    }

    .pool {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 18px;
      min-height: 140px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      transition: background 0.2s, border-color 0.2s;
    }

    .pool.drag-over {
      background: rgba(72, 219, 251, 0.08);
      border-color: #48dbfb;
    }

    .viewer-card {
      width: 92px;
      background: #2a2a3d;
      border-radius: 10px;
      padding: 8px 6px 10px;
      text-align: center;
      cursor: grab;
      user-select: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .viewer-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .viewer-card:active,
    .viewer-card.dragging {
      cursor: grabbing;
      opacity: 0.55;
      transform: scale(0.95);
    }

    .viewer-card.drag-before {
      box-shadow: -4px 0 0 0 #48dbfb, 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .viewer-card.drag-after {
      box-shadow: 4px 0 0 0 #48dbfb, 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .viewer-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15);
      overflow: hidden;
      flex-shrink: 0;
      background: #3a3a4d;
    }

    .viewer-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 50%;
    }

    .viewer-name {
      font-size: 0.72rem;
      font-weight: 600;
      color: #e8e8f0;
      word-break: break-word;
      line-height: 1.25;
      max-height: 2.5em;
      overflow: hidden;
    }

    .tier-content:empty::after,
    .pool:empty::after {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.9rem;
      font-style: italic;
      width: 100%;
      text-align: center;
      padding: 20px 0;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .tier {
        flex-direction: column;
      }

      .tier-header {
        width: 100%;
        min-width: auto;
        padding: 10px;
        font-size: 0.95rem;
      }

      h1 {
        font-size: 1.7rem;
      }
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <h1>Tierlista Widzów</h1>
  <br>

  <div class="tiers-container" id="tiers">
  </div>

  <div class="pool-section">
    <div class="pool-header">
      <div class="pool-title">Pula widzów</div>
      <button class="reset-btn" id="resetBtn" title="Wyczyść zapisane pozycje i przenieś wszystkich do puli">
        🔄 Resetuj wszystko
      </button>
    </div>
    <div class="pool" id="pool"></div>
  </div>

  <script>
    const CATEGORIES = [
      ["Totalna Sigiemka", "albo prawie"],
      ["Miłośnicy", "bardziej strimera niż streama"],
      ["Widzowie Premium", "jak są, to średnia czatu idzie w górę"],
      ["Średnia półka", "ani nie irytują, ani nie zachwycają"],
      ["Marudy", "raz na rok napisze coś sensownego a tak to marudzi"],
      ["NPC Brainrot", "czy to na pewno człowiek? czy już chat gpt"],
      ["Lurker", "więcej śpi niż ogląda"]
    ];

    const VIEWERS = [
      {name: "De_Destru", color: "#e74c3c", img: "pp/viewer1.jpg"},
      {name: "YouBaited", img: "pp/youbait.png"},
      {name: "Veximei", img: "pp/vexy.png"},
      {name: "Mairisaun", img: "pp/mairi.png"},
      {name: "Dantee_z", img: "pp/dante.png"},
      {name: "Hvsk103sa", img: "pp/hvsk.png"},
      {name: "Nosti103sa", img: "pp/nosti.png"},
      {name: "laufiq", img: "pp/lauf.png"},
      {name: "Himcia", img: "pp/himcia.png"},
      {name: "Palladyn654", img: "pp/paladyn.png"},
      {name: "Amelciabot", img: "pp/amelka.png"},
      {name: "Nesstim1", img: "pp/nestim.png"},
      {name: "Szpyciooo", img: "pp/szypycio.png"},
      {name: "Astrid", img: "pp/astrid.png"},
      {name: "ferdinandfe", img: "pp/ferdek.png"},
      {name: "Dosiek1402", img: "pp/dosiek.png"},
      {name: "Matiksonnnnn103sa", img: "pp/mati.png"},
      {name: "Merstive", img: "pp/merstiv.png"},
      {name: "Smifdbd", img: "pp/smif.png"},
      {name: "Martella", img: "pp/martela.png"},
      {name: "QLemii", color: "#e74c3c", img: "pp/viewer2.jpg"},
      {name: "Arvena", img: "pp/arvena.png"},
      {name: "Izolski", img: "pp/izo.png"},
      {name: "Davesonek", img: "pp/davso.png"},
      {name: "Audiocostamm", img: "pp/audio.png"},
      {name: "Starsiicle", img: "pp/star.png"},
      {name: "ooFatimaoo", img: "pp/fatima.png"},
      {name: "povJesieniara", img: "pp/jesieniara.png"},
      {name: "TickerSloth", img: "pp/ticker.png"},
      {name: "BezRobotnyWojtek", img: "pp/szpont.png"},
      {name: "Brokatowy", img: "pp/brokat.png"},
      {name: "AdamrePL", img: "pp/adam.png"},
      {name: "M4rtin3k", img: "pp/mart.png"}
    ];

    const STORAGE_KEY = "tierlista-widzow-state";

    const tiersEl = document.getElementById('tiers');
    const poolEl = document.getElementById('pool');
    const resetBtn = document.getElementById('resetBtn');

    CATEGORIES.forEach(([main, sub], index) => {
      const tier = document.createElement('div');
      tier.className = 'tier';
      tier.innerHTML = `
        <div class="tier-header">
          <span class="tier-main">${main}</span>
          <span class="tier-sub">${sub}</span>
        </div>
        <div class="tier-content" data-tier="${index}"></div>
      `;
      tiersEl.appendChild(tier);
    });

    function createViewerCard(viewer) {
      const card = document.createElement('div');
      card.className = 'viewer-card';
      card.draggable = true;
      card.dataset.name = viewer.name;

      const initials = viewer.name
        .split(/[\s_]+/)
        .map(w => w[0])
        .join('')
        .substring(0, 2)
        .toUpperCase();

      let avatarHTML;
      if (viewer.img) {
        avatarHTML = `<div class="viewer-avatar">
          <img src="${viewer.img}" alt="${viewer.name}" loading="lazy"
               onerror="this.style.display='none'; this.parentElement.textContent='${initials}'; this.parentElement.style.background='${viewer.color || '#3a3a4d'}'">
        </div>`;
      } else {
        avatarHTML = `<div class="viewer-avatar" style="background: ${viewer.color || '#3a3a4d'}">${initials}</div>`;
      }

      card.innerHTML = `
        ${avatarHTML}
        <div class="viewer-name">${viewer.name}</div>
      `;

      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', viewer.name);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
        setTimeout(() => card.style.opacity = '0.4', 0);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        card.style.opacity = '';
        clearDropIndicators();
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      return card;
    }

    const cards = {};

    VIEWERS.forEach(v => {
      const card = createViewerCard(v);
      cards[v.name] = card;
      poolEl.appendChild(card);
    });

    function clearDropIndicators() {
      document.querySelectorAll('.viewer-card.drag-before, .viewer-card.drag-after').forEach(el => {
        el.classList.remove('drag-before', 'drag-after');
      });
    }

    function getDropTarget(zone, clientX, clientY) {
      const cardEls = [...zone.querySelectorAll('.viewer-card:not(.dragging)')];
      if (cardEls.length === 0) return { target: null, place: 'end' };

      for (const el of cardEls) {
        const rect = el.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right &&
            clientY >= rect.top && clientY <= rect.bottom) {
          const midX = rect.left + rect.width / 2;
          return { target: el, place: clientX < midX ? 'before' : 'after' };
        }
      }

      let best = null;
      let bestScore = Infinity;
      for (const el of cardEls) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const score = dx * dx + dy * dy * 4;
        if (score < bestScore) {
          bestScore = score;
          best = el;
        }
      }

      if (!best) return { target: null, place: 'end' };

      const rect = best.getBoundingClientRect();
      if (clientX < rect.left) return { target: best, place: 'before' };
      if (clientX > rect.right) return { target: best, place: 'after' };
      const midX = rect.left + rect.width / 2;
      return { target: best, place: clientX < midX ? 'before' : 'after' };
    }

    function getCurrentState() {
      const state = { pool: [], tiers: {} };

      poolEl.querySelectorAll('.viewer-card').forEach(card => {
        state.pool.push(card.dataset.name);
      });

      document.querySelectorAll('.tier-content').forEach(zone => {
        const tierId = zone.dataset.tier;
        state.tiers[tierId] = [];
        zone.querySelectorAll('.viewer-card').forEach(card => {
          state.tiers[tierId].push(card.dataset.name);
        });
      });

      return state;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(getCurrentState()));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function applyState(state) {
      if (!state) return;

      if (Array.isArray(state.pool) || state.tiers) {
        if (Array.isArray(state.pool)) {
          state.pool.forEach(name => {
            if (cards[name]) poolEl.appendChild(cards[name]);
          });
        }
        if (state.tiers) {
          Object.entries(state.tiers).forEach(([tierId, names]) => {
            const zone = document.querySelector('.tier-content[data-tier="' + tierId + '"]');
            if (!zone || !Array.isArray(names)) return;
            names.forEach(name => {
              if (cards[name]) zone.appendChild(cards[name]);
            });
          });
        }
        return;
      }

      Object.entries(state).forEach(([name, location]) => {
        const card = cards[name];
        if (!card) return;
        if (location === 'pool') {
          poolEl.appendChild(card);
        } else {
          const zone = document.querySelector('.tier-content[data-tier="' + location + '"]');
          if (zone) zone.appendChild(card);
          else poolEl.appendChild(card);
        }
      });
    }

    applyState(loadState());

    const dropZones = [
      ...document.querySelectorAll('.tier-content'),
      poolEl
    ];

    dropZones.forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');

        clearDropIndicators();
        const info = getDropTarget(zone, e.clientX, e.clientY);
        if (info.target) {
          info.target.classList.add(info.place === 'before' ? 'drag-before' : 'drag-after');
        }
      });

      zone.addEventListener('dragleave', (e) => {
        if (!zone.contains(e.relatedTarget)) {
          zone.classList.remove('drag-over');
          clearDropIndicators();
        }
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        clearDropIndicators();

        const name = e.dataTransfer.getData('text/plain');
        const card = cards[name];
        if (!card) return;

        const info = getDropTarget(zone, e.clientX, e.clientY);

        if (info.target && info.target !== card) {
          if (info.place === 'before') {
            zone.insertBefore(card, info.target);
          } else {
            zone.insertBefore(card, info.target.nextSibling);
          }
        } else if (!info.target) {
          zone.appendChild(card);
        } else if (card.parentElement !== zone) {
          zone.appendChild(card);
        }

        saveState();
      });
    });

    document.addEventListener('dblclick', (e) => {
      const card = e.target.closest('.viewer-card');
      if (card && !poolEl.contains(card)) {
        poolEl.appendChild(card);
        saveState();
      }
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Na pewno zresetować? Wszystkie karty wrócą do puli i zapisany układ zostanie usunięty.')) {
        return;
      }

      VIEWERS.forEach(v => {
        if (cards[v.name]) {
          poolEl.appendChild(cards[v.name]);
        }
      });

      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}

      resetBtn.textContent = '✓ Zresetowano!';
      setTimeout(() => {
        resetBtn.innerHTML = '🔄 Resetuj wszystko';
      }, 1500);
    });
  </script>
</body>

</html>
