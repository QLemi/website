<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead by Daylight Streaks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_streaki.css">
  <script src="config_streaki.js"></script>
  <script src="script_streaki.js" defer></script>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="fog"></div>

  <header>
    <div class="logo-mark">STREAKS</div>
    <div class="subtitle">Dead by Daylight</div>
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="total-characters">0</div>
        <div class="stat-label">Characters</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-streaks">0</div>
        <div class="stat-label">Streaks</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="best-streak">0</div>
        <div class="stat-label">Best</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="active-count">0</div>
        <div class="stat-label">Active</div>
      </div>
    </div>
    <div class="controls">
      <select id="view-select" class="view-select" aria-label="Layout">
        <option value="default">Default</option>
        <option value="split">Split</option>
        <option value="neon">Neon (abandoned)</option>
        <option value="timeline">Timeline (abandoned)</option>
        <option value="lanes">Lanes (abandoned)</option>
      </select>
      <input type="search" id="streak-search" class="streak-search" placeholder="Search..." autocomplete="off">
      <button class="refresh-btn" onclick="refreshData()">Refresh Data</button>
    </div>
    <div class="tag-filters">
      <button class="tag-filter active" data-tag="K">Killer</button>
      <button class="tag-filter active" data-tag="S">Survivor</button>
      <button class="tag-filter active" data-tag="O">Both</button>
      <button class="tag-filter" data-tag="P">Playthrough</button>
      <button class="tag-filter min-filter active" id="min-streak-filter" type="button">10+</button>
    </div>
  </header>

  <main>
    <div class="section-title">All Streaks</div>
    <div class="grid" id="streak-grid"></div>
  </main>
</body>
</html>
