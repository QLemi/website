<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0e">
  <meta name="robots" content="noindex">
  <title>Error · Lemi</title>
  <link rel="stylesheet" href="/website/SharedFiles/dbd-layout.css?v=dbd-layout-7">
  <link rel="stylesheet" href="/website/SharedFiles/error-page.css?v=error-2">
  <style>
    body.page-error { display: grid; place-items: center; min-height: 100svh; margin: 0; padding: 24px; background: #0c0c0e; color: #e9e9eb; font-family: "Segoe UI", system-ui, sans-serif; }
    .page-error .error-shell { width: min(540px, 100%); box-sizing: border-box; }
    .page-error .error-home { color: #fff; }
  </style>
</head>
<body class="dbd-layout page-error">
  <main class="error-shell" aria-labelledby="error-title" aria-describedby="error-description">
    <p class="error-brand">Lemi <span aria-hidden="true">/</span> DBD tools</p>
    <div class="error-heading">
      <span class="error-mark" aria-hidden="true">!</span>
      <h1 class="error-title" id="error-title">Error</h1>
    </div>
    <p class="error-intro">We couldn't open this page.</p>
    <p class="error-description" id="error-description">The link may be incorrect or outdated, or the page may have been moved or removed. You can find all available tools on the main page.</p>
    <a class="error-home" id="home-link" href="https://qlemi.github.io/website/"><span aria-hidden="true">←</span> Back to main page</a>
  </main>
</body>
</html>
